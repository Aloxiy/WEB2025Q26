<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - GALATEA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .order-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .order-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .order-summary {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .order-total {
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
            text-align: right;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: "Caesar Dressing";
            font-size: 16px;
        }
        
        .place-order-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-family: "Caesar Dressing";
            font-size: 18px;
            width: 100%;
            margin-top: 20px;
        }
        
        .place-order-btn:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1 class="logo">GALATEA</h1>
        </header>
        
        <section class="order-container">
            <div class="order-header">
                <h2>CONTINUE ADMIRING THE ROBO-WOMEN IN GALATEA STORE</h2>
            </div>
            
            <div class="order-summary">
                <div id="orderItems"></div>
                <div class="order-total">TOTAL: $<span id="orderTotalPrice">0</span></div>
            </div>
            
            <form id="orderForm">
                <div class="form-group">
                    <label for="fullName">FULL NAME</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">PHONE</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="address">ADDRESS</label>
                    <input type="text" id="address" name="address" required>
                </div>
                
                <div class="form-group">
                    <label for="country">COUNTRY</label>
                    <input type="text" id="country" name="country" required>
                </div>
                
                <div class="form-group">
                    <label for="city">CITY</label>
                    <input type="text" id="city" name="city" required>
                </div>

                
                <button type="submit" class="place-order-btn">PLACE AN ORDER</button>
            </form>
        </section>
    </main>
    
    <script src="scripts/order.js"></script>
</body>
</html>
